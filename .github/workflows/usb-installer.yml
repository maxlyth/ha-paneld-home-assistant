name: USB installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/ha_paneld/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: custom_components/ha_paneld/frontend
        run: npm ci --ignore-scripts
      - name: Test and build frontend
        working-directory: custom_components/ha_paneld/frontend
        run: npm test && npm run build
      - name: Verify bundled HA module matches source
        run: git diff --exit-code -- custom_components/ha_paneld/static
      - name: Upload installer site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: custom_components/ha_paneld/frontend/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: usb-installer-pages
      cancel-in-progress: false
    steps:
      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
