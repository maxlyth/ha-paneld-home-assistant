name: HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# A superseded push should stop burning a runner. Runs on main are never
# cancelled, because main's timings are what the CI budget measures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release tag matches integration version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/verify_release_version.py -- "$RELEASE_TAG"
      # Only on a release tag: it asks the live site, so running it on every push
      # would tie ordinary CI to the site being up. The offline half of this check
      # runs with the tests on every push.
      - name: Set up Python for the help topic check
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.2"
      - name: Verify every help topic is known to the site
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/scripts/check_help_topics.py
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
