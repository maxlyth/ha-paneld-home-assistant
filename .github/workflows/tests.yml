name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.8.3"
            fixture: "0.13.357"
            frontend: "20260729.7"
          - home-assistant: "2026.9.0"
            fixture: "0.13.363"
            frontend: "20260826.4"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Select Home Assistant test version
        if: matrix.fixture != '0.13.357'
        run: >-
          python -m pip install --upgrade
          pytest-homeassistant-custom-component==${{ matrix.fixture }}
      - name: Verify test environment
        run: |
          python -m pip check
          python -c "import importlib.metadata as m; assert m.version('homeassistant') == '${{ matrix.home-assistant }}'"
      - name: Run lint and formatting checks
        run: ruff check . && ruff format --check .
      - name: Run type checks
        run: mypy custom_components/ha_paneld
      - name: Run tests
        run: python -m pytest
      - name: Install the Core runtime frontend
        run: >-
          python -m pip install
          home-assistant-frontend==${{ matrix.frontend }}
      - name: Prove restart and replay safety in real Core processes
        run: >-
          python tests/runtime/core_negative_harness.py
          --hass "$(command -v hass)"
          --expected-sha "$(git rev-parse HEAD)"
          --expected-home-assistant-version "${{ matrix.home-assistant }}"
