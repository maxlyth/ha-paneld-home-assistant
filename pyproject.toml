[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-paneld-home-assistant"
version = "0.1.0"
description = "Home Assistant custom integration for ha-paneld"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
authors = [{ name = "Max Lyth" }]
dependencies = []

[project.optional-dependencies]
test = [
  "adb-shell[async]==0.4.4",
  "mypy==2.3.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=custom_components.ha_paneld",
  "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
mypy_path = "tests/typing_stubs"
python_version = "3.14"
strict = true
strict_bytes = true
warn_unreachable = true

[tool.setuptools]
packages = []
