<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-screen-message="title"></title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
      --accent: #18bcf2; --accent-text: #04202b; --line: #dde2e8; --bad: #c62828;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --card: #1b2027; --text: #eef1f4; --muted: #9aa4af; --line: #2c333c; --bad: #ef6c6c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 30rem); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
      padding: 2rem 1.75rem; box-shadow: 0 1px 3px #0001, 0 8px 24px #0000000d; }
    .brand { display: flex; align-items: center; gap: .6rem; color: var(--muted);
      font-size: .9rem; margin-bottom: 1.5rem; }
    .brand img { width: 2rem; height: 2rem; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .75rem; }
    p { line-height: 1.55; margin: 0 0 1.25rem; color: var(--muted); }
    .step p.lead { color: var(--text); font-size: 1.05rem; }
    button.primary { display: block; width: 100%; border: 0; border-radius: .6rem;
      padding: .9rem 1rem; font: inherit; font-weight: 600; font-size: 1.05rem;
      background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.primary:disabled { opacity: .45; cursor: default; }
    a.primary { display: block; text-align: center; text-decoration: none; }
    .bar { height: .5rem; border-radius: 1rem; background: var(--line); overflow: hidden; margin: 1.25rem 0 .9rem; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
    .activity { color: var(--text); margin: 0 0 .5rem; }
    .spinner { width: 2.25rem; height: 2.25rem; border-radius: 50%; margin: .5rem 0 1.25rem;
      border: .25rem solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .bar > div { transition: none; } }
    .error h1 { color: var(--bad); }
    details { margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
    details summary { cursor: pointer; }
    details pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow: auto;
      background: var(--bg); border-radius: .5rem; padding: .75rem; }
    .advanced label { display: block; margin: .75rem 0; }
    .advanced input[type=text] { display: block; width: 100%; margin-top: .35rem; padding: .5rem; font: inherit; }
    .advanced button { margin-top: .5rem; padding: .5rem 1rem; font: inherit; }
    footer { text-align: center; font-size: .8rem; margin-top: 1rem; }
    footer a { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>

    <section id="step-preparing" class="step">
      <h1 data-screen-message="title"></h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="preparing-text" class="lead" role="status" aria-live="polite" data-screen-message="preparing"></p>
    </section>

    <section id="step-connect" class="step" hidden>
      <h1 data-screen-message="connectHeading"></h1>
      <p class="lead" data-screen-message="connectBody"></p>
      <button id="connect" class="primary" data-screen-message="connect"></button>
    </section>

    <section id="step-allow" class="step" hidden>
      <h1 data-screen-message="allowHeading"></h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="allow-text" class="lead" role="status" aria-live="polite" data-screen-message="allowBody"></p>
    </section>

    <section id="step-confirm" class="step" hidden>
      <h1 data-screen-message="confirmHeading"></h1>
      <p class="lead" data-screen-message="confirmBody"></p>
      <button id="install" class="primary" data-screen-message="install"></button>
    </section>

    <section id="step-progress" class="step" hidden>
      <h1 data-screen-message="progressHeading"></h1>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div>
      <p id="activity" class="activity" role="status" aria-live="polite"></p>
      <p data-screen-message="keepConnected"></p>
    </section>

    <section id="step-done" class="step" hidden>
      <h1 data-screen-message="doneHeading"></h1>
      <p id="done-text" class="lead" role="status" aria-live="polite"></p>
      <a id="open-setup" class="primary" hidden data-screen-message="openSetup"></a>
    </section>

    <section id="step-error" class="step error" hidden>
      <h1 data-screen-message="errorHeading"></h1>
      <p id="error-text" class="lead" role="alert"></p>
      <button id="retry" class="primary" data-screen-message="tryAgain"></button>
    </section>

    <details id="advanced" class="advanced" hidden>
      <summary data-screen-message="advanced"></summary>
      <label><span data-screen-message="releaseFiles"></span> <input id="bundle-files" type="file" multiple accept=".apk,.sha256,.sig,.json"></label>
      <label><span data-screen-message="releaseRc"></span> <input id="bundle-rc" type="text" maxlength="64" autocomplete="off" spellcheck="false" data-screen-placeholder="releaseRcExample"></label>
      <button id="verify-bundle" data-screen-message="verifyRelease"></button>
    </details>

    <details id="support">
      <summary data-screen-message="details"></summary>
      <pre id="support-log"></pre>
    </details>
  </div>
  <footer><a href="./THIRD_PARTY_NOTICES.txt">Third-party licenses</a></footer>
</main><script type="module" src="/src/install-main.mjs"></script></body>
</html>
