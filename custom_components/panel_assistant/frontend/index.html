<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-screen-message="title"></title>
  <!-- wizard-look -->
  <style>
    body { margin: 0; min-height: 100vh; background: var(--bg); padding: 24px 16px; }
    .card p.activity { color: var(--text); margin: 0 0 .5rem; }
    details { margin-top: 1.25rem; color: var(--dim); font-size: .85rem; }
    details summary { cursor: pointer; }
    details pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow: auto;
      background: var(--bg); border-radius: .5rem; padding: .75rem; }
    .advanced label { font-weight: 400; color: var(--dim); }
    .advanced input[type=text] { display: block; width: 100%; margin-top: .35rem; padding: .5rem; font: inherit; }
    footer { text-align: center; font-size: .8rem; margin-top: 1rem; }
    footer a { color: var(--dim); }
  </style>
</head>
<body><main class="wiz">
  <div class="wiz-brand"><img src="__BRAND_ICON__" alt=""><span>ha-paneld</span></div>
  <ol id="journey" class="wiz-dots" aria-label="Progress"><!-- journey --></ol>
  <div class="card">

    <section id="step-preparing" class="step">
      <h2 data-screen-message="title"></h2>
      <div class="spinner" aria-hidden="true"></div>
      <p id="preparing-text" class="lead" role="status" aria-live="polite" data-screen-message="preparing"></p>
    </section>

    <section id="step-connect" class="step" hidden>
      <h2 data-screen-message="connectHeading"></h2>
      <p class="lead" data-screen-message="connectBody"></p>
      <button id="connect" class="primary" data-screen-message="connect"></button>
    </section>

    <section id="step-allow" class="step" hidden>
      <h2 data-screen-message="allowHeading"></h2>
      <div class="spinner" aria-hidden="true"></div>
      <p id="allow-text" class="lead" role="status" aria-live="polite" data-screen-message="allowBody"></p>
    </section>

    <section id="step-confirm" class="step" hidden>
      <h2 data-screen-message="confirmHeading"></h2>
      <p id="confirm-body" class="lead" data-screen-message="confirmBody"></p>
      <button id="install" class="primary" data-screen-message="install"></button>
    </section>

    <section id="step-progress" class="step" hidden>
      <h2 data-screen-message="progressHeading"></h2>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div>
      <p id="activity" class="activity" role="status" aria-live="polite"></p>
      <p data-screen-message="keepConnected"></p>
    </section>

    <section id="step-done" class="step" hidden>
      <h2 data-screen-message="doneHeading"></h2>
      <p id="done-text" class="lead" role="status" aria-live="polite"></p>
      <a id="open-setup" class="primary" hidden data-screen-message="openSetup"></a>
    </section>

    <section id="step-error" class="step error" hidden>
      <h2 data-screen-message="errorHeading"></h2>
      <p id="error-text" class="lead" role="alert"></p>
      <button id="retry" class="primary" data-screen-message="tryAgain"></button>
    </section>

    <details id="advanced" class="advanced" hidden>
      <summary data-screen-message="advanced"></summary>
      <label><span data-screen-message="releaseFiles"></span> <input id="bundle-files" type="file" multiple accept=".apk,.sha256,.sig,.json"></label>
      <label><span data-screen-message="releaseRc"></span> <input id="bundle-rc" type="text" maxlength="64" autocomplete="off" spellcheck="false" data-screen-placeholder="releaseRcExample"></label>
      <button id="verify-bundle" data-screen-message="verifyRelease"></button>
    </details>

    <details id="support">
      <summary data-screen-message="details"></summary>
      <pre id="support-log"></pre>
    </details>
  </div>
  <footer><a href="./THIRD_PARTY_NOTICES.txt" target="_blank" rel="noopener">Third-party licenses</a></footer>
</main><script type="module" src="/src/install-main.mjs"></script></body>
</html>
